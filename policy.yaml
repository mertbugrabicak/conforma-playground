name: Konflux Release Policies
description: >-
  Policy Configuration to test Konflux SBOM Policies on a set of SBOMs

sources:
  - name: Default
    policy:
      - oci::quay.io/conforma/release-policy:latest
    config:
      include:
      # Only SBOM policies
      - 'sbom'
      - 'sbom_cyclonedx'
      - 'sbom_spdx'